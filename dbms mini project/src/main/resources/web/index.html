<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Records</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><div class="brand">SR</div><div><p class="eyebrow">ACADEMIC RECORDS</p><h1>Student directory</h1><p class="sub">Manage student information stored in your MySQL database.</p></div></header>
<section class="card form-card"><div class="section-title"><div><p class="eyebrow">RECORD DETAILS</p><h2 id="form-title">Add a student</h2></div><span class="status"><i></i> MySQL connected</span></div>
<form id="student-form"><input id="studentId" type="hidden"><div class="fields"><label>Full name<input id="name" maxlength="100" placeholder="e.g. Asha Rao" required></label><label>Email address<input id="email" type="email" maxlength="150" placeholder="asha@example.com" required></label><label>Course<input id="course" maxlength="100" placeholder="e.g. Computer Science" required></label><label>Semester<input id="semester" type="number" min="1" max="12" placeholder="1–12" required></label></div><div class="actions"><button class="primary" type="submit" id="save-btn">Add student</button><button class="quiet hidden" type="button" id="cancel-btn">Cancel edit</button><span id="notice" role="status"></span></div></form></section>
<section class="card list-card"><div class="section-title"><div><p class="eyebrow">DATABASE</p><h2>Saved students <span class="count" id="count">0</span></h2></div><button class="quiet" id="refresh" type="button">↻ Refresh list</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>STUDENT</th><th>COURSE</th><th>SEMESTER</th><th></th></tr></thead><tbody id="student-list"><tr><td colspan="5" class="empty">Loading records…</td></tr></tbody></table></div></section><footer>Student Record Management <span>·</span> Java + MySQL</footer></main><script src="/app.js"></script></body></html>
